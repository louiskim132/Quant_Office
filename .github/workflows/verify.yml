name: Verify
on:
  pull_request:
  push:
    branches: [main, 'codex/**', 'parallel/**']
permissions:
  contents: read
concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.19.0'
      - name: Coordination regression tests
        run: node --test tools/parallel.test.mjs tools/desktop.test.mjs
      - name: Install locked dependencies
        working-directory: app
        run: pnpm install --frozen-lockfile
      - name: Format check
        working-directory: app
        run: pnpm format:check
      - name: Typecheck
        working-directory: app
        run: pnpm typecheck
      - name: Unit tests
        working-directory: app
        run: pnpm exec tsx --test --test-concurrency=4 tests/*.test.ts
      - name: Build
        working-directory: app
        run: pnpm build
      - name: Package
        working-directory: app
        run: node scripts/package.mjs
      - name: Desktop end-to-end
        working-directory: app
        shell: pwsh
        run: |
          $env:QRO_EXECUTABLE = "$PWD\release\Quant Research Office-win32-x64\Quant Research Office.exe"
          pnpm exec tsx tests/desktop.e2e.ts
